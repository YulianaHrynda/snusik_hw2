# One pipeline, the city is a parameter. Every city runs exactly this job.
resources:
  jobs:
    airbnb_city_pipeline:
      name: airbnb_city_pipeline
      description: "Bronze -> silver -> gold for one Inside Airbnb city (city key from src/airbnb/cities.json)."
      max_concurrent_runs: 4
      parameters:
        - name: city
          default: boston
        - name: snapshot_date
          default: ""   # empty = the snapshot pinned in cities.json
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/pipeline/00_setup.py
        - task_key: bronze
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ../src/pipeline/01_ingest_bronze.py
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ../src/pipeline/02_build_silver.py
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ../src/pipeline/03_build_gold.py
